[project]
name = "agentic-post-gen"
version = "0.1.0"
description = "Multi-agent post generator with LangGraph, FAISS retrieval, and Langfuse observability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # LangChain (v1 module layout) & LangGraph
    "langchain-openai>=1.0.0,<2",
    "langchain-core>=1.0.0,<2",
    "langchain-text-splitters>=1.0.0,<2",
    "langgraph>=1.0.0,<2",
    
    # Azure integrations
    "azure-cosmos>=4.5.1",
    "azure-identity>=1.15.0",
    "azure-ai-documentintelligence>=1.0.2",
    
    # Vector stores & retrieval
    "faiss-cpu>=1.8.0",
    "tiktoken>=0.5.2",
    "openai>=1.0.0",
    "pymupdf>=1.23.0",
    "pillow>=10.0.0",
    
    # Evaluation & Observability
    "deepeval>=3.0.0",
    "langfuse>=3.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.25.2",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.7.1",
    "httpx>=0.25.2",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agents", "api", "lib", "workflows"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short"
